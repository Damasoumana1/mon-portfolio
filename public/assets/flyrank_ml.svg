<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#grid)" />
  <circle cx="650" cy="180" r="260" fill="url(#cyanGlow)" />
  <circle cx="180" cy="320" r="220" fill="url(#cyanGlow)" />

  <!-- Data Flow & Chart Lines -->
  <path d="M 40 320 Q 220 280, 360 300 T 740 220" fill="none" stroke="#06b6d4" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 4" />
  <path d="M 40 350 Q 260 310, 420 330 T 760 260" fill="none" stroke="#3b82f6" stroke-opacity="0.25" stroke-width="2" />

  <!-- Main Info Card -->
  <g transform="translate(60, 70)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#0f172a" stroke="#06b6d4" stroke-opacity="0.7" stroke-width="1.5" />
    <circle cx="16" cy="17" r="6" fill="#06b6d4" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#06b6d4" letter-spacing="0.5">MACHINE LEARNING CAPSTONE</text>

    <!-- Project Title -->
    <text x="0" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="-1">
      FlyRank <tspan fill="url(#cyanGrad)">AI</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">
      Search Performance Signals &amp; Content Opportunity Scoring
    </text>

    <!-- Tech Badges Grid -->
    <g transform="translate(0, 155)">
      <g transform="translate(0, 0)">
        <rect width="180" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="90" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8">⚡ Sentence-Transformers</text>
      </g>
      <g transform="translate(190, 0)">
        <rect width="155" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="77" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#a78bfa">🎯 Embeddings &amp; Cluster</text>
      </g>
      <g transform="translate(355, 0)">
        <rect width="135" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="67" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#34d399">🔍 Intent Modeling</text>
      </g>
      <g transform="translate(500, 0)">
        <rect width="125" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="62" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#f59e0b">📊 Scikit-Learn</text>
      </g>
    </g>

    <!-- Terminal Code Strip -->
    <g transform="translate(0, 220)">
      <text font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#38bdf8">
        &gt; FlyRank ML Intern | Client-held-out Ranking Study | Live Case Study
      </text>
    </g>
  </g>

  <!-- Graphic Vector: Analytics / Embedding Radar & Nodes -->
  <g transform="translate(670, 210)" opacity="0.9">
    <!-- Radar / Coordinate Grid -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="20" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#06b6d4"/>

    <!-- Data Clusters Points -->
    <circle cx="-35" cy="-25" r="7" fill="#06b6d4" />
    <circle cx="-50" cy="15" r="5" fill="#38bdf8" />
    <circle cx="30" cy="-45" r="6" fill="#8b5cf6" />
    <circle cx="45" cy="25" r="8" fill="#34d399" />
    <circle cx="15" cy="50" r="5" fill="#f59e0b" />

    <!-- Connecting Vectors -->
    <line x1="0" y1="0" x2="-35" y2="-25" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="0" y1="0" x2="30" y2="-45" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="0" y1="0" x2="45" y2="25" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.6"/>
  </g>
</svg>
