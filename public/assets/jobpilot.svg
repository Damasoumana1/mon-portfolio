<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#grid)" />
  <circle cx="600" cy="180" r="280" fill="url(#glow)" />
  <circle cx="150" cy="300" r="200" fill="url(#glow)" />

  <!-- Code/Protocol Circuit Accent Lines -->
  <path d="M 50 100 L 220 100 L 260 140 L 750 140" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2" fill="none" />
  <path d="M 120 380 L 350 380 L 390 340 L 720 340" stroke="#818cf8" stroke-opacity="0.3" stroke-width="2" fill="none" />
  <circle cx="260" cy="140" r="4" fill="#38bdf8" />
  <circle cx="390" cy="340" r="4" fill="#818cf8" />

  <!-- Central Hub / Card -->
  <g transform="translate(60, 75)">
    <!-- Main Badge -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5" />
    <circle cx="16" cy="17" r="6" fill="#10b981" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="0.5">MODEL CONTEXT PROTOCOL</text>

    <!-- Title -->
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">
      JobPilot <tspan fill="url(#brandGrad)">Africa</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500" fill="#94a3b8">
      AI-Powered MCP Server for Early-Career &amp; Talent Matching
    </text>

    <!-- Capabilities Badges -->
    <g transform="translate(0, 160)">
      <!-- Badge 1: FastMCP -->
      <g transform="translate(0, 0)">
        <rect width="105" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="52" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#f8fafc">⚡ FastMCP</text>
      </g>
      <!-- Badge 2: Skill Gap AI -->
      <g transform="translate(115, 0)">
        <rect width="145" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="72" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8">🎯 Skill Gap Analysis</text>
      </g>
      <!-- Badge 3: AI Interview -->
      <g transform="translate(270, 0)">
        <rect width="165" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="82" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#c084fc">🤖 AI Interview Coach</text>
      </g>
      <!-- Badge 4: Africa Tech -->
      <g transform="translate(445, 0)">
        <rect width="130" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="65" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#f59e0b">🌍 Africa Tech</text>
      </g>
    </g>

    <!-- Open Source / Python Footer -->
    <g transform="translate(0, 220)">
      <text font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#38bdf8">
        &gt; pip install fastmcp pydantic | github.com/Damasoumana1/mcp-jobpilot-africa-
      </text>
    </g>
  </g>

  <!-- Right Decorative Icon / Network Graphic -->
  <g transform="translate(640, 200)" opacity="0.85">
    <circle cx="0" cy="0" r="60" fill="#1e293b" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="40" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <!-- Center Node -->
    <circle cx="0" cy="0" r="14" fill="url(#brandGrad)" />
    <!-- Surrounding Nodes -->
    <circle cx="-50" cy="-35" r="8" fill="#38bdf8" />
    <line x1="0" y1="0" x2="-50" y2="-35" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="50" cy="-35" r="8" fill="#818cf8" />
    <line x1="0" y1="0" x2="50" y2="-35" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="55" cy="30" r="8" fill="#c084fc" />
    <line x1="0" y1="0" x2="55" y2="30" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="-45" cy="40" r="8" fill="#f59e0b" />
    <line x1="0" y1="0" x2="-45" y2="40" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6"/>
  </g>
</svg>
